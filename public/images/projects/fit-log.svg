<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A stationary exercise bike">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6b3c"/>
      <stop offset="1" stop-color="#a6d94a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- ground shadow -->
  <ellipse cx="405" cy="424" rx="200" ry="22" fill="#0d3319" opacity="0.3"/>

  <!-- base bar -->
  <rect x="220" y="404" width="370" height="16" rx="8" fill="#33383d"/>
  <rect x="212" y="396" width="40" height="30" rx="8" fill="#23272b"/>
  <rect x="558" y="396" width="40" height="30" rx="8" fill="#23272b"/>

  <!-- rear flywheel housing -->
  <circle cx="290" cy="330" r="66" fill="#3d4349"/>
  <circle cx="290" cy="330" r="50" fill="#23272b"/>
  <circle cx="290" cy="330" r="16" fill="#565e66"/>
  <g stroke="#565e66" stroke-width="6" stroke-linecap="round">
    <path d="M290 288 L290 306"/>
    <path d="M326 312 L311 321"/>
    <path d="M326 349 L311 340"/>
    <path d="M290 372 L290 354"/>
    <path d="M254 349 L269 340"/>
    <path d="M254 312 L269 321"/>
  </g>
  <circle cx="290" cy="330" r="7" fill="#f26a21"/>

  <!-- main frame post to seat -->
  <path d="M330 384 L392 214" stroke="#33383d" stroke-width="20" stroke-linecap="round"/>
  <path d="M330 384 L392 214" stroke="#4d545b" stroke-width="8" stroke-linecap="round"/>

  <!-- seat post + seat -->
  <path d="M392 214 L470 208" stroke="#33383d" stroke-width="16" stroke-linecap="round"/>
  <path d="M442 206 q34 -22 64 -2 q-8 18 -34 18 q-24 0 -30 -16 z" fill="#23272b"/>
  <path d="M446 200 q30 -18 56 -2 q-8 12 -30 12 q-20 0 -26 -10 z" fill="#f26a21"/>

  <!-- handlebar post -->
  <path d="M480 396 L516 236" stroke="#33383d" stroke-width="20" stroke-linecap="round"/>
  <path d="M480 396 L516 236" stroke="#4d545b" stroke-width="8" stroke-linecap="round"/>

  <!-- handlebars -->
  <path d="M516 236 L560 220" stroke="#23272b" stroke-width="14" stroke-linecap="round"/>
  <path d="M560 220 q26 -4 30 22" stroke="#23272b" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M516 236 L470 224" stroke="#23272b" stroke-width="12" stroke-linecap="round"/>
  <circle cx="590" cy="246" r="9" fill="#f26a21"/>

  <!-- crank + pedals -->
  <circle cx="378" cy="384" r="26" fill="#23272b"/>
  <circle cx="378" cy="384" r="9" fill="#565e66"/>
  <path d="M378 384 L404 408" stroke="#565e66" stroke-width="8" stroke-linecap="round"/>
  <rect x="398" y="402" width="34" height="12" rx="5" fill="#23272b"/>
  <path d="M378 384 L352 360" stroke="#565e66" stroke-width="8" stroke-linecap="round"/>
  <rect x="330" y="352" width="34" height="12" rx="5" fill="#23272b"/>
</svg>
